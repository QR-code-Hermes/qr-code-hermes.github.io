  :root {
    --verde: #C1F97A;      /* o único verde da Hermes */
    --petroleo: #34424C;
    /* TEMA (trocado pelo montar.py): fundo, cor do texto, cor do card, texto do card, borda do card */
    --fundo: var(--petroleo); --tinta: var(--verde);
    --card: var(--verde); --card-txt: var(--petroleo); --card-borda: var(--verde); --borda: 0px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--fundo);
    color: var(--tinta);
    font-family: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100dvh;
    padding: max(48px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 420px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .marca { width: 84%; max-width: 340px; margin: 0 auto 48px; display: block; }
  .botoes { display: flex; flex-direction: column; gap: 14px; }
  .botao {
    --corte: 14px;                                  /* o corte a 45° das letras e do grafismo */
    display: flex; align-items: center; gap: 16px;
    background: var(--card-borda); color: var(--card-txt);
    position: relative; isolation: isolate;
    text-decoration: none;
    clip-path: polygon(var(--corte) 0, 100% 0, 100% calc(100% - var(--corte)),
                       calc(100% - var(--corte)) 100%, 0 100%, 0 var(--corte));
    padding: 18px 22px; min-height: 78px;
    transition: transform .12s ease, filter .12s ease;
  }
  .botao::before {                                /* o miolo do card: recuado pela borda, mesmo corte */
    content: ""; position: absolute; inset: var(--borda); z-index: -1; background: var(--card);
    clip-path: polygon(calc(var(--corte) - var(--borda) * .41) 0, 100% 0, 100% calc(100% - var(--corte) + var(--borda) * .41),
                       calc(100% - var(--corte) + var(--borda) * .41) 100%, 0 100%, 0 calc(var(--corte) - var(--borda) * .41));
  }
  .botao .texto { flex: 1; }
  .botao .seta { width: 18px; height: 18px; opacity: .7; }
  .botao:active { transform: scale(.98); filter: brightness(1.15); }
  .botao svg { width: 30px; height: 30px; flex: none; }
  .botao .titulo { font-weight: 600; font-size: 18px; line-height: 1.2; }
  .botao .detalhe { font-size: 14px; opacity: .8; margin-top: 3px; }
</style>
